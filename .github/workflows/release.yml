# Release of the app (added by the demo-environment skill; replaces the bootcamp's deploy.yml and the publish jobs of
# build.yml). After a green Build of master, it turns that build's packages into a release candidate:
#   - the UI image <registry>/<slug>/<deployable>:<version> in the system's registry (Azure OIDC, id-<slug>-acr-push),
#     its tag write-locked
#   - the database package and the acceptance-test package (Linux x64 only) in the Octopus built-in feed
#   - a release <version> of the Octopus project <slug>-<deployable>; its lifecycle deploys it to the first environment
# The version is the Build run's MAJOR.MINOR.run_number, the same number build.yml stamps into the packages.
# Credentials: GitHub OIDC only (environment "release"). Deployments, approvals and the GitOps pin are Octopus's.
name: Release

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The Octopus actions (push-package, create-release) look the space up by name, not by ID.
  OCTOPUS_SPACE: ${{ vars.OCTOPUS_SPACE_NAME }}

jobs:
  # A docs-only change skips the heavy Build jobs (build.yml, job changes), so that run has no packages to release.
  packages:
    # A push to master, or a Build of master started by hand: after a change to the Octopus deployment process (which a
    # release snapshots), `gh workflow run Build --ref master` makes a new release without a code change.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    outputs:
      found: ${{ steps.find.outputs.found }}
    steps:
      - name: Find the build's packages
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" \
            --jq '[.artifacts[] | select(.name == "churchbulletin-nuget-packages")] | length')
          if [ "$count" -gt 0 ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

  release:
    needs: packages
    if: needs.packages.outputs.found == 'true'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workflow = Get-Content -LiteralPath .github/workflows/build.yml -Raw
          $major = [regex]::Match($workflow, '(?m)^\s*MAJOR_VERSION:\s*(\d+)').Groups[1].Value
          $minor = [regex]::Match($workflow, '(?m)^\s*MINOR_VERSION:\s*(\d+)').Groups[1].Value
          if (-not $major -or -not $minor) { throw 'MAJOR_VERSION and MINOR_VERSION not found in build.yml' }
          "version=$major.$minor.${{ github.event.workflow_run.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Download the build's packages
        uses: actions/download-artifact@v8
        with:
          name: churchbulletin-nuget-packages
          path: ./packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Extract the UI for the image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-ChildItem -Path ./packages -Filter 'ChurchBulletin.UI.*.nupkg' | Select-Object -First 1
          if (-not $package) { throw 'ChurchBulletin.UI package not found in the build artifact' }
          Expand-Archive -LiteralPath $package.FullName -DestinationPath ./package-extract -Force
          $dll = Get-ChildItem -Path ./package-extract -Filter 'ClearMeasure.Bootcamp.UI.Server.dll' -Recurse | Select-Object -First 1
          if (-not $dll) { throw 'ClearMeasure.Bootcamp.UI.Server.dll not found in the UI package' }
          New-Item -ItemType Directory -Path ./built -Force | Out-Null
          Copy-Item -Path (Join-Path $dll.DirectoryName '*') -Destination ./built -Recurse -Force
          Get-ChildItem -Path ./built -Include '*.nuspec', '[Content_Types].xml', '*.psmdcp' -Recurse | Remove-Item -Force
          Remove-Item -Path ./built/_rels, ./built/package -Recurse -Force -ErrorAction SilentlyContinue

      # The build facts the app serves at /_build (CAP-079): written into the folder the image is built from, so the
      # image carries them at its content root (/app/build-facts.json). The repository's own script writes them: the
      # code from this checkout; tests, coverage, complexity, CRAP and Qodana from the artifacts of the Build run,
      # each null when its artifact is not there. A repository without the script skips the step.
      - name: Stamp the build facts into the image's files
        if: hashFiles('scripts/Write-BuildFacts.ps1') != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/Write-BuildFacts.ps1 -DownloadArtifacts
          -Version '${{ steps.version.outputs.version }}'
          -RunId '${{ github.event.workflow_run.id }}'
          -BuiltAt '${{ github.event.workflow_run.updated_at }}'
          -OutputPath 'built/build-facts.json'

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_ACR_PUSH }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image
        env:
          IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.SYSTEM_SLUG }}/${{ vars.DEPLOYABLE_NAME }}:${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          az acr login --name "${{ vars.ACR_NAME }}"
          docker build --file Dockerfile --tag "$IMAGE" .
          docker push "$IMAGE"
          # A released image never changes: lock its tag (role "ACR tag lock" of the seed).
          az acr repository update --name "${{ vars.ACR_NAME }}" --image "${{ vars.SYSTEM_SLUG }}/${{ vars.DEPLOYABLE_NAME }}:${{ steps.version.outputs.version }}" \
            --write-enabled false --delete-enabled false --output none
          echo "Pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign in to Octopus
        uses: OctopusDeploy/login@v2
        with:
          server: ${{ vars.OCTOPUS_URL }}
          service_account_id: ${{ vars.OCTOPUS_SERVICE_ACCOUNT_ID }}

      # The build's acceptance-test package carries Playwright's Node driver for five platforms (about 1 GB unpacked).
      # Octopus runs the tests on Linux x64 only: keep that driver, drop the rest and the coverage collector.
      - name: Trim the acceptance-test package for Octopus
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $source = Get-ChildItem -Path ./packages -Filter "ChurchBulletin.AcceptanceTests.$version.nupkg" | Select-Object -First 1
          if (-not $source) { throw 'ChurchBulletin.AcceptanceTests package not found in the build artifact' }
          $work = Join-Path $env:RUNNER_TEMP 'acceptance-tests'
          Expand-Archive -LiteralPath $source.FullName -DestinationPath $work -Force
          # -Force everywhere: on Linux, wildcards and Get-ChildItem skip dot-folders such as .playwright otherwise.
          Get-ChildItem -Path $work -Recurse -Directory -Force | Where-Object {
              ($_.Parent.Name -eq 'node' -and $_.Parent.Parent.Name -eq '.playwright' -and $_.Name -ne 'linux-x64') -or
              ($_.Name -in @('CodeCoverage', 'BlazorDebugProxy') -and $_.Parent.FullName -eq $work)
          } | Remove-Item -Recurse -Force
          Remove-Item -Path (Join-Path $work '_rels'), (Join-Path $work 'package') -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $work -Include '*.nuspec', '[Content_Types].xml' -Recurse -Force | Remove-Item -Force
          if (-not (Test-Path -LiteralPath (Join-Path $work '.playwright' 'node' 'linux-x64'))) { throw 'The Playwright driver for linux-x64 is missing from the acceptance-test package' }
          New-Item -ItemType Directory -Path ./octopus-packages -Force | Out-Null
          $target = "./octopus-packages/ChurchBulletin.AcceptanceTests.$version.zip"
          Compress-Archive -Path (Get-ChildItem -LiteralPath $work -Force).FullName -DestinationPath $target -CompressionLevel Optimal
          "Acceptance tests: $([Math]::Round($source.Length / 1MB)) MB -> $([Math]::Round((Get-Item $target).Length / 1MB)) MB" >> $env:GITHUB_STEP_SUMMARY

      - name: Push the database and acceptance-test packages
        uses: OctopusDeploy/push-package-action@v4
        with:
          packages: |
            packages/ChurchBulletin.Database.${{ steps.version.outputs.version }}.nupkg
            octopus-packages/ChurchBulletin.AcceptanceTests.${{ steps.version.outputs.version }}.zip
          overwrite_mode: IgnoreIfExists

      - name: Create the release
        uses: OctopusDeploy/create-release-action@v4
        with:
          project: ${{ vars.SYSTEM_SLUG }}-${{ vars.DEPLOYABLE_NAME }}
          release_number: ${{ steps.version.outputs.version }}
          package_version: ${{ steps.version.outputs.version }}
          ignore_existing: true
          release_notes: "Build ${{ github.event.workflow_run.html_url }} of ${{ github.event.workflow_run.head_sha }}"
